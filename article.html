<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Article — GreenBox</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <!-- Marked.js for client-side Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <script defer src="assets/js/main.js"></script>
  <script defer src="assets/js/utils.js"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LCJ16E5XG3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-LCJ16E5XG3');
  </script>
</head>

<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html"><img src="images/logo.svg" class="logo" alt="" /> <span>GreenBox</span></a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      <nav class="nav-links" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="downloads.html">Download</a>
        <!-- <a href="use-cases.html">Use Cases</a> -->
        <a href="https://github.com/superymk" target="_blank" rel="noopener">GitHub</a>
        <a href="blog.html">News</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container narrow">
        <article id="article">
          <h1 id="article-title" class="article-title">Loading…</h1>
          <p id="article-meta" class="muted"></p>
          <div id="article-content" class="prose"></div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> GreenBox. All rights reserved.</div>
  </footer>

  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug');
      const titleEl = document.getElementById('article-title');
      const metaEl = document.getElementById('article-meta');
      const content = document.getElementById('article-content');

      function fixRelativeUrls(rootEl) {
        const isAbsolute = (url) =>
          !url ||
          url.startsWith('http://') ||
          url.startsWith('https://') ||
          url.startsWith('mailto:') ||
          url.startsWith('/') ||
          url.startsWith('#');

        const prefix = 'articles/'; // base dir where your .md lives

        // img / video / audio / source
        rootEl.querySelectorAll('img, video, audio, source').forEach(el => {
          const src = el.getAttribute('src');
          if (!isAbsolute(src)) {
            el.setAttribute('src', prefix + src);
          }
        });

        // links inside article (optional, if you use relative links in md)
        rootEl.querySelectorAll('a').forEach(el => {
          const href = el.getAttribute('href');
          if (!isAbsolute(href)) {
            el.setAttribute('href', prefix + href);
          }
        });
      }

      try {
        const posts = await (await fetch('data/posts.json', { cache: 'no-store' })).json();
        const post = posts.find(p => p.slug === slug);
        if (!post) throw new Error('Post not found');

        titleEl.textContent = post.title;
        metaEl.textContent = new Date(post.date).toLocaleDateString();

        const md = await (await fetch(`articles/${encodeURIComponent(slug)}.md`, { cache: 'no-store' })).text();
        content.innerHTML = marked.parse(md);

        // 👇 Fix image/video paths after rendering
        fixRelativeUrls(content);
      } catch (e) {
        titleEl.textContent = 'Not found';
        metaEl.textContent = '';
        content.innerHTML = '<p>Sorry, we could not load this article.</p>';
        console.error(e);
      }
    })();
  </script>

</body>

</html>
