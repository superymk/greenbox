<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Blog — GreenBox</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <script defer src="assets/js/main.js"></script>
</head>
<body>
<header class="site-header">
  <div class="container nav">
    <a class="brand" href="index.html"><img src="images/logo.svg" class="logo" alt=""/> <span>GreenBox</span></a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="downloads.html">Download</a>
      <a href="use-cases.html">Use Cases</a>
      <a href="https://github.com/yourname/greenbox" rel="noopener" target="_blank">GitHub</a>
      <a class="active" href="blog.html">Blog</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <h1>Blog</h1>
      <!-- Vertical news-style list -->
      <div id="news-feed" class="news-list"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">© <span id="year"></span> GreenBox.</div>
</footer>

<script>
(async function () {
  const container = document.getElementById('news-feed');
  try {
    const posts = await (await fetch('data/posts.json', {cache:'no-store'})).json();
    // Sort newest first
    posts.sort((a,b)=> new Date(b.date) - new Date(a.date));

    // Group by year to mimic the “year separators” vibe
    let currentYear = null;
    posts.forEach(p => {
      const d = new Date(p.date);
      const y = d.getFullYear();
      if (y !== currentYear) {
        currentYear = y;
        const yearEl = document.createElement('div');
        yearEl.className = 'news-year';
        yearEl.textContent = String(y);
        container.appendChild(yearEl);
      }

      const row = document.createElement('article');
      row.className = 'news-row';
      row.innerHTML = `
        <div class="news-date">${d.toLocaleDateString()}</div>
        <div class="news-body">
          <h3 class="news-title"><a href="article.html?slug=${encodeURIComponent(p.slug)}">${p.title}</a></h3>
          ${p.summary ? `<p class="news-summary">${p.summary}</p>` : ''}
          <div class="news-actions">
            <a class="btn" href="article.html?slug=${encodeURIComponent(p.slug)}">Read</a>
          </div>
        </div>
      `;
      container.appendChild(row);
    });
  } catch (e) {
    container.innerHTML = '<p>Unable to load posts.</p>';
    console.error(e);
  }
})();
</script>
</body>
</html>
