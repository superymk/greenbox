<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" role="img" aria-label="All-in-one PC with protected SecApp and non-overlapping compromised apps">
  <!-- background -->
  <rect x="0" y="0" width="800" height="520" fill="#12161d"></rect>

  <!-- monitor shell -->
  <rect x="120" y="70" width="560" height="280" rx="14" fill="none" stroke="#4cc38a" stroke-width="4"></rect>
  <!-- inner screen border (usable screen area: x=138..662, y=90..330) -->
  <rect x="138" y="90" width="524" height="240" rx="8" fill="none" stroke="#3dbb7c" stroke-width="2"></rect>

  <!-- stand -->
  <rect x="365" y="358" width="70" height="10" rx="4" fill="none" stroke="#4cc38a" stroke-width="4"></rect>
  <rect x="330" y="370" width="140" height="22" rx="8" fill="none" stroke="#4cc38a" stroke-width="4"></rect>

  <!-- keyboard (green) -->
  <rect x="250" y="410" width="300" height="36" rx="8" fill="none" stroke="#4cc38a" stroke-width="4"></rect>
  <line x1="262" y1="422" x2="538" y2="422" stroke="#3dbb7c" stroke-width="2"></line>
  <line x1="262" y1="434" x2="538" y2="434" stroke="#3dbb7c" stroke-width="2"></line>

  <!-- mouse (green) -->
  <rect x="572" y="410" width="48" height="34" rx="16" fill="none" stroke="#4cc38a" stroke-width="4"></rect>
  <line x1="596" y1="418" x2="596" y2="436" stroke="#3dbb7c" stroke-width="2"></line>

  <!-- central protected SecApp (x=310..490, y=120..280) -->
  <rect x="310" y="120" width="180" height="160" rx="10" fill="none" stroke="#4cc38a" stroke-width="5"></rect>
  <text x="400" y="205" text-anchor="middle" fill="#4cc38a" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="26" font-weight="800">SecApp</text>

  <!-- left-side red boxes -->
  <rect x="150" y="106" width="100" height="92" rx="10" fill="none" stroke="#e5484d" stroke-width="4"></rect>
  <text x="200" y="160" text-anchor="middle" fill="#e5484d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="20" font-weight="700">Malware</text>

  <rect x="150" y="215" width="135" height="100" rx="10" fill="none" stroke="#e5484d" stroke-width="4"></rect>
  <text x="217.5" y="258" text-anchor="middle" fill="#e5484d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="20" font-weight="700">(Vulnerable)</text>
  <text x="217.5" y="282" text-anchor="middle" fill="#e5484d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="20" font-weight="700">App</text>

  <!-- RIGHT vulnerable app — WIDER -->
  <!-- Starts close to SecApp (x=506) with width=140 -> right edge=646 (< 662 inner edge) -->
  <rect x="506" y="140" width="140" height="110" rx="10" fill="none" stroke="#e5484d" stroke-width="4"></rect>
  <!-- Center text at the box center: 506 + 140/2 = 576 -->
  <text x="576" y="186" text-anchor="middle" fill="#e5484d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="20" font-weight="700">(Vulnerable)</text>
  <text x="576" y="210" text-anchor="middle" fill="#e5484d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="20" font-weight="700">App</text>

  <!-- bottom-right malware (still clear of others and edges) -->
  <rect x="506" y="262" width="92" height="60" rx="10" fill="none" stroke="#e5484d" stroke-width="4"></rect>
  <text x="552" y="298" text-anchor="middle" fill="#e5484d" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="20" font-weight="700">Malware</text>

  <!-- caption -->
  <text x="400" y="492" text-anchor="middle" fill="#ffffff" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="18">Green means secure. Red means compromised.</text>
</svg>
