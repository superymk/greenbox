<!-- GreenBox logo — simplified, screen-first, matches 256x256 (viewBox 0 0 64 64) -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" role="img" aria-label="GreenBox logo">
  <!-- Colors consistent with the site -->
  <!-- Primary green: #4cc38a ; Muted green: #3dbb7c -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer monitor frame (minimal) -->
    <rect x="9" y="11" width="46" height="38" rx="6" stroke="#4cc38a" stroke-width="2"></rect>

    <!-- Inner screen border (subtle) -->
    <rect x="13" y="15" width="38" height="30" rx="4" stroke="#3dbb7c" stroke-width="1.5"></rect>

    <!-- Protected SecApp box (centered on screen) -->
    <rect x="24" y="20" width="16" height="20" rx="3" stroke="#4cc38a" stroke-width="2"></rect>

    <!-- Minimal base hint (short stand line) -->
    <line x1="22" y1="54" x2="42" y2="54" stroke="#4cc38a" stroke-width="2"></line>
  </g>
</svg>
